spring.application.name=CircuteBreaker
server.port=9090

Resource.service.url=http://localhost:8080

# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.resource.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.resource.slidingWindowSize=5
resilience4j.circuitbreaker.instances.resource.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.resource.failureRateThreshold=50
resilience4j.circuitbreaker.instances.resource.waitDurationInOpenState=60s
resilience4j.circuitbreaker.instances.resource.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.resource.automaticTransitionFromOpenToHalfOpenEnabled=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
resilience4j.circuitbreaker.instances.resource.registerHealthIndicator=true